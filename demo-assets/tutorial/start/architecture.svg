<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>ARK architecture at a glance</title>
<desc>Browsers and agents talk HTTP+JSON to one Python server, which owns one folder per project.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker><marker id="arrow-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F5A7A"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<text x="32" y="44" font-size="24" fill="#111827" font-weight="700" text-anchor="start">Architecture at a glance</text>
<text x="32" y="70" font-size="14" fill="#4B5563" font-weight="400" text-anchor="start">One stdlib Python server. One folder per project. SQLite is the source of truth.</text>
<rect x="32" y="110" width="300" height="150" rx="8" fill="#ECE8DE" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<rect x="32" y="110" width="6" height="150" rx="3" fill="#B7791F" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="50" y="136" font-size="15" fill="#111827" font-weight="700" text-anchor="start">People</text>
<text x="50" y="156" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Desktop browser / installed app</text>
<text x="50" y="173" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Phone (PWA, QR pairing)</text>
<text x="50" y="190" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Android shell</text>
<rect x="32" y="290" width="300" height="150" rx="8" fill="#ECE8DE" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<rect x="32" y="290" width="6" height="150" rx="3" fill="#7C5C9E" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="50" y="316" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Agents</text>
<text x="50" y="336" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">DSH · Codex · Claude Code</text>
<text x="50" y="353" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Agent API: /api/agent/v1/…</text>
<text x="50" y="370" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Bearer token, scoped skills</text>
<rect x="420" y="110" width="380" height="330" rx="8" fill="#ECE8DE" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<rect x="420" y="110" width="6" height="330" rx="3" fill="#1F5A7A" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="438" y="136" font-size="15" fill="#111827" font-weight="700" text-anchor="start">ARK server  (python -m arkstudio serve)</text>
<text x="438" y="156" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">REST API + auth + project permissions</text>
<text x="438" y="173" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Run manager: agent sessions, worktrees</text>
<text x="438" y="190" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Assistant: local harness or your model</text>
<text x="438" y="207" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Skills: setup · agent-team · rrsi · design</text>
<text x="438" y="224" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">GPU adapter: probe, queue, dry-run</text>
<text x="438" y="241" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Workspace API: files, raw previews</text>
<text x="438" y="258" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start"></text>
<text x="438" y="275" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Standard library only. Loopback by default.</text>
<rect x="888" y="110" width="280" height="330" rx="8" fill="#ECE8DE" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<rect x="888" y="110" width="6" height="330" rx="3" fill="#2F7D5B" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="906" y="136" font-size="15" fill="#111827" font-weight="700" text-anchor="start">my-project.ark/</text>
<text x="906" y="156" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">project.json · the manifest</text>
<text x="906" y="173" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">ark.sqlite3 · units, links, activity</text>
<text x="906" y="190" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">assets/ · figures, video, PDFs</text>
<text x="906" y="207" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">setup/ · environment profile</text>
<text x="906" y="224" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">exports/ · logs/</text>
<text x="906" y="241" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start"></text>
<text x="906" y="258" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Copy the folder = copy</text>
<text x="906" y="275" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">the whole project.</text>
<line x1="336" y1="185" x2="414" y2="185" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="336" y1="365" x2="414" y2="365" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="374" y="176" font-size="11" fill="#4B5563" font-weight="400" text-anchor="middle">HTTP</text>
<text x="374" y="356" font-size="11" fill="#4B5563" font-weight="400" text-anchor="middle">HTTP</text>
<line x1="804" y1="275" x2="882" y2="275" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="843" y="266" font-size="11" fill="#4B5563" font-weight="400" text-anchor="middle">read/write</text>
<circle cx="420" cy="110" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="420" y="115" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text>
<circle cx="888" cy="110" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="888" y="115" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">B</text>
<text x="32" y="500" font-size="13" fill="#4B5563" font-weight="400" text-anchor="start">A  Every project-scoped call is checked again on the server; the UI is not the gate.</text>
<text x="32" y="524" font-size="13" fill="#4B5563" font-weight="400" text-anchor="start">B  The graph you see in Map is a view of this database, not a separate file.</text>
<text x="32" y="548" font-size="13" fill="#4B5563" font-weight="400" text-anchor="start">Secrets are stored as references (env:NAME), never as values.</text>
</svg>

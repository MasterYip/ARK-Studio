<text x="78" y="194" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Warm-up stabilises small models</text>
<text x="78" y="216" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">status:active</text>
<rect x="60" y="300" width="300" height="92" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<rect x="60" y="300" width="6" height="92" rx="3" fill="#38bdf8" fill-opacity="1.0" stroke="none" stroke-width="1"/>

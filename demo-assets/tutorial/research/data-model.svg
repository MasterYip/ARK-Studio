<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>The ARK data model</title>
<desc>Units with one type, one status and one importance, joined by typed links. The example chain: idea, question, claims, evidence, experiment, task.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker><marker id="arrow-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F5A7A"/></marker></defs>
<rect width="1200" height="640" fill="#F7F5EF"/>
<text x="32" y="44" font-size="24" fill="#111827" font-weight="700" text-anchor="start">The data model: units and typed links</text>
<text x="32" y="70" font-size="14" fill="#4B5563" font-weight="400" text-anchor="start">Every node is a unit with a stable ID. Every edge is a typed, directed link.</text>
<rect x="60" y="140" width="300" height="92" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<rect x="60" y="140" width="6" height="92" rx="3" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1"/>

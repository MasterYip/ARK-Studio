<text x="458" y="434" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Warm-up keeps final loss</text>
<text x="458" y="456" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">status:open</text>

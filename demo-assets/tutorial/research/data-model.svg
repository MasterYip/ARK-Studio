<text x="838" y="514" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Run the 3-seed comparison</text>
<text x="838" y="536" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">status:review</text>

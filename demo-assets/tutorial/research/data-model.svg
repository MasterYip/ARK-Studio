<text x="458" y="274" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Warm-up removes early spikes</text>
<text x="458" y="296" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">status:review</text>

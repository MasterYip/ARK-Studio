<text x="780.0" y="218.0" font-size="11" fill="#1F5A7A" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">supports</text>
<line x1="970.0" y1="300" x2="970.0" y2="232" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="978.0" y="270.0" font-size="11" fill="#1F5A7A" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">produces</text>
<line x1="820" y1="346.0" x2="740" y2="426.0" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="780.0" y="402.0" font-size="11" fill="#1F5A7A" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">validates</text>
<line x1="970.0" y1="460" x2="970.0" y2="392" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="978.0" y="430.0" font-size="11" fill="#1F5A7A" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">part_of</text>
<text x="32" y="600" font-size="13" fill="#4B5563" font-weight="400" text-anchor="start">Reserved tags: exactly one type:, one status:, one importance: per unit. Everything else (topic:, stage:, channel:, color:…) is a free tag.</text>
</svg>

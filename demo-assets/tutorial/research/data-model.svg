<text x="78" y="354" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Does warm-up remove loss spikes?</text>
<text x="78" y="376" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">status:active</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>The Home workspace, annotated</title>
<desc>Wireframe of Home: the setup status badge, two starter prompt cards with Copy prompt and Preview, the standing-rules note and the Review &amp; confirm button.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker><marker id="arrow-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F5A7A"/></marker></defs>
<rect width="1200" height="620" fill="#F7F5EF"/>
<text x="32" y="44" font-size="24" fill="#111827" font-weight="700" text-anchor="start">Home, annotated</text>
<text x="32" y="70" font-size="14" fill="#4B5563" font-weight="400" text-anchor="start">Where every session starts: setup status and copy-ready agent prompts.</text>
<rect x="32" y="96" width="1136" height="488" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<text x="56" y="132" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Start with an agent</text>
<text x="56" y="156" font-size="13" fill="#4B5563" font-weight="400" text-anchor="start">Copy a prompt into your coding agent (DSH, Codex, Claude Code). ARK keeps the record; the agent does the work.</text>
<rect x="880" y="112" width="170" height="30" rx="15" fill="#FDF3E1" fill-opacity="1.0" stroke="#B7791F" stroke-width="1"/>
<text x="965" y="132" font-size="12" fill="#111827" font-weight="600" text-anchor="middle">Setup: waiting for you</text>
<rect x="1060" y="112" width="92" height="30" rx="6" fill="#1F5A7A" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="1106" y="132" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">Review &amp; confirm</text>
<circle cx="872" cy="112" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="872" y="117" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<circle cx="1152" cy="112" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="1152" y="117" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<rect x="56" y="186" width="532" height="160" rx="8" fill="#F7F5EF" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<text x="72" y="218" font-size="15" fill="#111827" font-weight="700" text-anchor="start">1. Set up this environment</text>
<text x="72" y="244" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Once per machine or new repo. Setup, then</text>
<text x="72" y="261" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">you confirm; then what to ask next.</text>
<rect x="72" y="296" width="104" height="32" rx="6" fill="#1F5A7A" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="124" y="317" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">Copy prompt</text>
<rect x="186" y="296" width="80" height="32" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<text x="226" y="317" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">Preview</text>
<rect x="608" y="186" width="532" height="160" rx="8" fill="#F7F5EF" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<text x="624" y="218" font-size="15" fill="#111827" font-weight="700" text-anchor="start">2. Start / continue research team</text>
<text x="624" y="244" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">Every new agent session: load context,</text>
<text x="624" y="261" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start">summarise, offer options, coordinate.</text>
<rect x="624" y="296" width="104" height="32" rx="6" fill="#1F5A7A" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="676" y="317" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">Copy prompt</text>
<rect x="738" y="296" width="80" height="32" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#6B7280" stroke-width="1"/>
<text x="778" y="317" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">Preview</text>
<circle cx="56" cy="186" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="56" y="191" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<circle cx="72" cy="296" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="72" y="301" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="56" y="372" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">Both prompts carry standing rules: read ARK before working; record tasks, progress,</text>
<text x="56" y="390" font-size="12" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">evidence and decisions after every step, without reminders.</text>
<circle cx="68" cy="452" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="68" y="457" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="90" y="457" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Setup status: not started → draft → waiting for you → confirmed → ready.</text>
<circle cx="68" cy="482" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="68" y="487" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="90" y="487" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Two starter prompts: 1 once per machine or repository, 2 in every new agent session.</text>
<circle cx="68" cy="512" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="68" y="517" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="90" y="517" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Copy prompt puts the full text on your clipboard. Preview shows it first.</text>
<circle cx="68" cy="542" r="12" fill="#B23A48" stroke="none" stroke-width="0"/>
<text x="68" y="547" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="90" y="547" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Review &amp; confirm: one dialog, 1/2 project setup then 2/2 my resources. Only a person confirms.</text>
</svg>

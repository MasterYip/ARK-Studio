[package]
name = "ark-studio"
version = "2.1.6"
description = "ARK Studio desktop shell: tray, settings, saved servers and the bundled ark-server sidecar"
authors = ["Raymon Yip"]
license = "AGPL-3.0-only"
repository = "https://github.com/MasterYip/ARK-Studio"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ark_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# "ARK Studio 2.x.y is available": a system notification once per version.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
url = "2"
# Health checks of saved servers (and, with a desktop link, their project
# lists); the same reqwest/rustls the updater already brings in.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Connect check (probe.rs): the system proxy for an address (the matcher
# reqwest uses), and racing the proxied and the direct route (both crates
# are already in the tree).
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
futures-util = { version = "0.3", default-features = false }
# Image copy bridge for ARK pages (copy_image_png): writes RGBA images to the
# system clipboard (Windows, macOS, X11/Wayland).
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

plugins { id 'com.android.application' }

android {
    namespace 'com.masteryip.arkstudio'
    compileSdk 33

    defaultConfig {
        applicationId 'com.masteryip.arkstudio'
        minSdk 26
        targetSdk 33
        versionCode 18
        versionName '2.1.3'
        // The app ships English and Chinese; keep library strings to the same languages.
        resourceConfigurations += ['en', 'zh']
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

apply from: '../shared/update/update.gradle'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'
}

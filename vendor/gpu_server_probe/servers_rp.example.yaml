# ARK GPU probe adapter — safe example server list
#
# Copy this file to your private ARK config location:
#
#   ~/.ark/gpu_servers.yaml               (default)
#   $ARK_PRIVATE_DIR/gpu_servers.yaml     (if ARK_PRIVATE_DIR is set)
#   any path named by $ARK_GPU_SERVERS_CONFIG
#
# Then set `enabled: true` below (or start ARK with ARK_GPU_PROBE=1).
# Passwords, private keys, tokens and identity files are NOT supported: the
# adapter uses your SSH agent and ~/.ssh/config. Hosts below are RFC 5737
# documentation addresses and are not reachable.
enabled: false

defaults:
  port: 22
  user: ubuntu
  timeout_seconds: 8

servers:
  - name: gpu-server-1
    host: gpu-server-1.example.com
    port: 22
    user: ubuntu
    tags: [4090, primary]
    note: "Primary interactive node"

  - name: h200-1
    host: 192.0.2.21
    user: ubuntu
    tags: [h200]
    note: "Set a per-server timeout below if this node is slow to answer"

  - name: h20-2
    host: 192.0.2.32
    port: 2222
    user: lab
    timeout_seconds: 12
    tags: [h20]
    note: "Port-forwarded node; alias can also live in ~/.ssh/config"


# Optional bare-metal execution queue.  It stays disabled unless this block is
# enabled explicitly.  Agents submit logical jobs; the queue probes, places,
# launches over SSH and tracks the remote pid/status/log.
queue:
  enabled: false
  state_dir: /tmp/ark-gpu-queue
  poll_seconds: 5
  default_timeout_minutes: 240
  # Share a card while resources permit. Zero means no additional job-count cap.
  # Set a positive count or allow_colocation: false to restrict sharing.
  max_jobs_per_gpu: 0
  max_utilization_pct: 10
  min_free_memory_mb: 1024
  allow_colocation: true
  # Optional shell setup run inside each allocated job, e.g. conda activation.
  setup: ""
  # Map agent-visible ARK paths to paths that exist on the GPU host.
  path_map:
    - from: /mnt/shared/research
      to: /srv/research
  # Non-secret environment defaults for the remote job.
  env:
    PYTHONUNBUFFERED: "1"

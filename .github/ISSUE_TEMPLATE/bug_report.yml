name: Bug report
description: Something in ARK Studio does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove private data (server addresses, tokens, user names, file paths,
        project content) from everything you paste. Report security problems
        privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "2.0.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, browser; desktop, server or Android"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-studio"
version = "2.0.0"
description = "ARK (Auto-Research Kit): a local-first, node-first research workbench for ideas, plans, maps, agent tasks, production and distribution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Raymon Yip"}]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/MasterYip/ARK-Studio"
Documentation = "https://github.com/MasterYip/ARK-Studio/blob/main/docs/README.md"
Issues = "https://github.com/MasterYip/ARK-Studio/issues"

[project.optional-dependencies]
# Interactive PTY support for the Files terminal drawer.  POSIX uses the
# standard-library `pty` module; Windows uses pywinpty/ConPTY.  Optional so the
# app and the test suite keep working with the stdio fallback.
pty = ["pywinpty>=2.0; sys_platform == 'win32'"]

[project.scripts]
arkstudio = "arkstudio.__main__:main"

[tool.setuptools]
packages = ["arkstudio", "arkstudio.skills"]
include-package-data = true

[tool.setuptools.package-data]
arkstudio = ["web/**/*", "demo-assets/*"]
"arkstudio.skills" = [
  "assets/*/*.md", "assets/*/*.json",
  "assets/*/*/*.md", "assets/*/*/*.json",
  "LICENSES/*.txt",
]
